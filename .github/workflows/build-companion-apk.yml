name: Build Messa Companion APK

on:
  push:
    branches:
      - main
      - feature/messa-companion-apk
    paths:
      - 'companion-apk/**'
      - '.github/workflows/build-companion-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Gradle 8.7
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o gradle.zip
          unzip -q gradle.zip
          echo "${PWD}/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Accept Android SDK Licenses & Verify SDK
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> $GITHUB_ENV
          if [ -d "${ANDROID_HOME}/cmdline-tools/latest/bin" ]; then
            yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Generate Gradle Wrapper
        working-directory: companion-apk
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: companion-apk
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messa-companion-debug.apk
          path: companion-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
