name: Build Messa Companion APK

on:
  push:
    branches:
      - main
      - feature/messa-companion-apk
    paths:
      - 'companion-apk/**'
      - '.github/workflows/build-companion-apk.yml'
  pull_request:
    paths:
      - 'companion-apk/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Android Companion APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        working-directory: companion-apk
        run: |
          gradle wrapper --gradle-version 8.7

      - name: Build Debug APK
        working-directory: companion-apk
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: messa-companion-debug.apk
          path: companion-apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
